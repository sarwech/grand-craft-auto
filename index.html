<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grand Craft Auto</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #2a2146; --page: #f6e8d8; --core: #fdf4e6; --shadow: rgba(42, 26, 74, .42); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a5d70; font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
  canvas { display: block; touch-action: none; cursor: pointer; }
  .paper { background:
      radial-gradient(120% 90% at 22% 12%, rgba(255, 252, 240, .9), rgba(255, 252, 240, 0) 60%),
      repeating-linear-gradient(97deg, rgba(120, 90, 70, .035) 0 1px, rgba(255, 255, 255, 0) 1px 5px), var(--page);
    color: var(--ink); border-radius: 3px; box-shadow: 0 1px 0 rgba(255, 250, 235, .9) inset, 0 -1px 0 rgba(90, 60, 50, .25) inset, 0 10px 22px -6px var(--shadow), 0 2px 3px rgba(74, 48, 68, .3); }
  .hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); font: italic 14px/1.3 Georgia, serif; color: #fff8ea; opacity: .9;
    letter-spacing: .03em; pointer-events: none; text-shadow: 0 1px 3px #4a3040; transition: opacity 1.2s; white-space: nowrap; z-index: 3; }
  .hint.gone { opacity: 0; }

  #start { position: fixed; inset: 0; display: grid; place-items: center; z-index: 10; cursor: pointer; background: linear-gradient(180deg, #2a2146 0%, #7a4a8c 38%, #f08a6c 70%, #ffc27a 100%); transition: opacity .9s; }
  #start .card { width: min(430px, 78vw); padding: 48px 34px 56px; text-align: center; transform-origin: 50% 100%; transform: rotateX(0deg) rotate(-1.4deg);
    transition: transform .75s cubic-bezier(.5, -0.35, .7, .6), opacity .2s .6s; position: relative; }
  #start .card::after { content: ''; position: absolute; left: 6%; right: 6%; bottom: 13px; border-top: 2px dashed rgba(59, 42, 51, .28); }
  #start .card { background: none; box-shadow: none; width: auto; }
  #start .card::after { display: none; }
  #start h1 { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 900 italic clamp(54px, 12vw, 132px)/0.92 'Arial Black', 'Helvetica Neue', Impact, sans-serif; letter-spacing: -.02em; }
  #start h1 span { display: block; padding: 0 .16em; -webkit-text-stroke: 2px #2a2146; paint-order: stroke fill; filter: drop-shadow(0 3px 0 #2a2146) drop-shadow(0 12px 14px rgba(20, 10, 40, .45)); }
  #start h1 span:nth-child(1) { color: #ff8fa3; transform: rotate(-4deg); }
  #start h1 span:nth-child(2) { color: #fdf0d8; transform: rotate(2deg) translateX(.2em); }
  #start h1 span:nth-child(3) { color: #46c6c0; transform: rotate(-2deg) translateX(-.1em); }
  #wordmark { width: min(74vw, 96vh, 760px); height: auto; filter: drop-shadow(0 14px 18px rgba(20, 10, 40, .45)); }
  #credit { position: fixed; right: 14px; bottom: 12px; z-index: 6; font: 13px/1 Georgia, serif; padding: 7px 11px 8px; text-decoration: none; transform: rotate(-1.5deg); opacity: .92; }
  body.quiet #credit { display: none; }
  #start.gone { opacity: 0; pointer-events: none; }

  #prompt { position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; padding: 6px 12px 7px; font-size: 15px; white-space: nowrap;
    transform-origin: 50% 100%; opacity: 0; transition: opacity .18s; will-change: transform; }
  #prompt::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px; background: var(--page); transform: translateX(-50%) rotate(45deg);
    box-shadow: 3px 3px 4px -2px var(--shadow); }
  #prompt { border-radius: 16px; padding: 9px 13px 10px; display: flex; gap: 6px; }
  #prompt i { position: relative; z-index: 1; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); opacity: .78; }
  #prompt.on { opacity: 1; }

  #caption { position: fixed; left: 50%; bottom: 5.5%; z-index: 4; max-width: min(820px, 76vw); padding: 12px 22px 13px; font-size: clamp(16px, 1.9vw, 22px); line-height: 1.35;
    text-align: center; pointer-events: none; transform-origin: 50% 100%; transform: translateX(-50%) perspective(700px) rotateX(86deg) rotate(.5deg); opacity: 0;
    transition: transform .55s cubic-bezier(.3, 1.45, .5, 1), opacity .15s; }
  #caption.on { transform: translateX(-50%) perspective(700px) rotateX(0deg) rotate(.5deg); opacity: 1; }
  #caption.cue { white-space: nowrap; max-width: 92vw; padding: 9px 24px 10px; }
  body.paper-pointer, body.paper-pointer *, body.no-pointer, body.no-pointer * { cursor: none !important; }
  #pointer { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; display: none; will-change: transform; }
  #pointer svg { position: absolute; filter: drop-shadow(1.5px 2.5px 1.6px rgba(74, 48, 68, .42)); }
  #pointer .arrow { left: -3px; top: -2px; } #pointer .talk { left: -5px; top: -31px; display: none; }
  #pointer.hot .arrow { display: none; } #pointer.hot .talk { display: block; }
  #replies { position: fixed; left: 0; right: 0; bottom: 6%; z-index: 5; display: flex; justify-content: center; gap: min(34vw, 520px); pointer-events: none; perspective: 700px; }
  #replies button { all: unset; box-sizing: border-box; font: inherit; font-size: clamp(15px, 1.7vw, 21px); color: var(--ink); padding: 11px 20px 12px; max-width: 30vw; text-align: center; cursor: pointer; position: relative;
    background: radial-gradient(120% 90% at 22% 12%, rgba(255, 252, 240, .9), rgba(255, 252, 240, 0) 60%), var(--page); border-radius: 3px;
    box-shadow: 0 1px 0 rgba(255, 250, 235, .9) inset, 0 10px 22px -6px var(--shadow), 0 2px 3px rgba(74, 48, 68, .3);
    transform-origin: 50% 100%; transform: rotateX(86deg); opacity: 0; transition: transform .5s cubic-bezier(.3, 1.45, .5, 1), opacity .15s, box-shadow .15s; }
  #replies button:nth-child(1) { rotate: -2deg; } #replies button:nth-child(2) { rotate: 1.6deg; }
  #replies.on button { transform: rotateX(0deg); opacity: 1; pointer-events: auto; }
  #replies.on button:nth-child(2) { transition-delay: .09s; }
  #replies button.sel { box-shadow: 0 1px 0 rgba(255, 250, 235, .9) inset, 0 0 0 2px rgba(59, 42, 51, .5), 0 12px 24px -6px var(--shadow); }
  #replies button.heard { background: #e4dac6; color: rgba(59, 42, 51, .62); }
  #replies button.heard::after { content: ''; position: absolute; right: 0; top: 0; border-style: solid; border-width: 0 15px 15px 0; border-color: transparent #cbbfa8 transparent transparent; filter: drop-shadow(-1px 1px 1px rgba(74, 48, 68, .35)); }
  #pointer .aim { left: -19px; top: -19px; display: none; }
  #pointer.aim .arrow, #pointer.aim .talk { display: none; } #pointer.aim .aim { display: block; }
  #hud { position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .5s; perspective: 700px; }
  body.play #hud { opacity: 1; }
  #hud.talk #map, #hud.talk #cash { opacity: 0; }
  #stars { position: absolute; right: 16px; top: 12px; display: flex; gap: 2px; perspective: 500px; }
  #stars svg { width: clamp(34px, 4.2vw, 54px); height: auto; transform-origin: 50% 100%; transform: rotateX(88deg); opacity: 0; filter: drop-shadow(0 6px 5px rgba(42, 26, 74, .45));
    transition: transform .5s cubic-bezier(.3, 1.6, .5, 1), opacity .12s; }
  #stars svg:nth-child(1) { rotate: -7deg; } #stars svg:nth-child(3) { rotate: 6deg; }
  #stars svg.on { transform: rotateX(0deg); opacity: 1; }
  #cash { position: absolute; left: 16px; top: 14px; padding: 5px 12px 5px 26px; rotate: -3deg; border-radius: 3px 8px 8px 3px; transition: opacity .3s, scale .18s; }
  #cash::before { content: ''; position: absolute; left: 9px; top: 50%; width: 9px; height: 9px; margin-top: -5px; border-radius: 50%; background: #2a5d70; box-shadow: 0 1px 1px rgba(255, 250, 235, .8), 0 -1px 1px rgba(60, 40, 50, .5) inset; }
  #cash.bump { scale: 1.16; }
  #cash canvas { display: block; height: clamp(22px, 2.6vw, 32px); width: auto; }
  #map { position: absolute; left: 18px; bottom: 18px; padding: 7px; rotate: -2.6deg; transition: opacity .3s; border-radius: 2px;
    box-shadow: 0 0 0 1.3px rgba(42, 26, 74, .62), 0 1px 0 rgba(255, 250, 235, .9) inset, 0 10px 18px -6px var(--shadow), 0 2px 3px rgba(74, 48, 68, .3); }
  #map::before { content: ''; position: absolute; left: 50%; top: -11px; width: 64px; height: 22px; margin-left: -32px; rotate: 3deg; z-index: 1;
    background: repeating-linear-gradient(90deg, rgba(255, 244, 214, .78) 0 6px, rgba(246, 230, 196, .78) 6px 7px); box-shadow: 0 1px 2px rgba(74, 48, 68, .25);
    clip-path: polygon(0 8%, 6% 0, 12% 10%, 18% 0, 24% 8%, 100% 0, 100% 92%, 94% 100%, 88% 90%, 82% 100%, 76% 92%, 0 100%); }
  #map canvas { display: block; width: clamp(150px, 15.5vw, 222px); height: auto; border-radius: 1px; }
  #keyhint { position: absolute; left: 50%; bottom: 7%; margin-left: -88px; padding: 6px 8px 4px; border-radius: 6px; transform-origin: 50% 100%; transform: perspective(600px) rotateX(86deg) rotate(1.5deg); opacity: 0;
    transition: transform .5s cubic-bezier(.3, 1.5, .5, 1), opacity .15s; }
  #keyhint.on { transform: perspective(600px) rotateX(0deg) rotate(1.5deg); opacity: 1; }
  #keyhint canvas { display: block; width: 160px; height: 70px; }
  #radio { position: absolute; left: 50%; top: 12px; margin-left: -40px; padding: 6px; border-radius: 10px; transform-origin: 50% 0; transform: rotateX(-88deg) rotate(-2deg); opacity: 0;
    transition: transform .45s cubic-bezier(.3, 1.5, .5, 1), opacity .12s; }
  #radio.on { transform: rotateX(0deg) rotate(-2deg); opacity: 1; }
  #radio canvas { display: block; width: 68px; height: 68px; }
  #big { position: fixed; left: 50%; top: 40%; z-index: 11; pointer-events: none; padding: 14px 22px 10px; transform-origin: 50% 100%; transform: translate(-50%, -50%) perspective(900px) rotateX(88deg) rotate(-2deg); opacity: 0;
    transition: transform .6s cubic-bezier(.3, 1.5, .5, 1), opacity .15s; }
  #big.on { transform: translate(-50%, -50%) perspective(900px) rotateX(0deg) rotate(-2deg); opacity: 1; }
  #big canvas { display: block; width: min(52vw, 560px); height: auto; }
  #bits { position: fixed; inset: 0; z-index: 8; pointer-events: none; overflow: hidden; }
  #bits b { position: absolute; left: 50%; top: 40%; width: 11px; height: 7px; border-radius: 1px; box-shadow: 0 2px 2px rgba(42, 26, 74, .3); animation: bit 1.5s cubic-bezier(.2, .7, .4, 1) forwards; }
  @keyframes bit { 0% { transform: translate(0, 0) rotate(0deg); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
  #wipe { position: fixed; inset: -4% -8%; z-index: 9; pointer-events: none; transform: translateX(-112%) rotate(-2deg); transition: transform .5s cubic-bezier(.5, 0, .3, 1); border-radius: 0; }
  #wipe.on { transform: translateX(0) rotate(0deg); }
  #wipe.out { transform: translateX(112%) rotate(2deg); }
  #title { position: fixed; left: 50%; top: -1vh; z-index: 8; pointer-events: none; transform-origin: 50% 0; visibility: hidden; transform: translateX(-50%) perspective(1100px) rotateX(-90deg) rotate(-1.5deg); }
  #title canvas { display: block; width: min(34vw, 46vh, 480px); height: auto; filter: drop-shadow(0 14px 18px rgba(20, 10, 40, .45)); }
  #replies.on button.press { transform: translateY(5px) scale(.95); transition: transform .12s; box-shadow: 0 0 0 2px rgba(59, 42, 51, .6), 0 3px 6px -3px var(--shadow); }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js", "papercraft/": "./papercraft/" } }</script>

<body>
<div id="start"><div class="card"><canvas id="wordmark" width="1200" height="1040"></canvas></div></div>
<a id="credit" class="paper" href="https://x.com/starwardshar" target="_blank" rel="noopener">made by @starwardshar</a>
<div id="prompt" class="paper"><i></i><i></i><i></i></div>
<div id="caption" class="paper"></div>
<div id="pointer"><svg class="arrow" width="30" height="34" viewBox="0 0 30 34"><path d="M3 2 L3 25 L9.5 19.5 L14 30 L19 27.8 L14.6 17.6 L23 17 Z" fill="#fbf3e1" stroke="#4a2f33" stroke-width="1.7" stroke-linejoin="round"/><path d="M5.2 6.5 L5.2 20.4" stroke="#fffdf4" stroke-width="1.3" stroke-linecap="round"/></svg><svg class="aim" width="38" height="38" viewBox="0 0 38 38"><circle cx="19" cy="19" r="12" fill="none" stroke="#4a2f33" stroke-width="5.4"/><circle cx="19" cy="19" r="12" fill="none" stroke="#fbf3e1" stroke-width="2.6"/><path d="M19 1 V11 M19 27 V37 M1 19 H11 M27 19 H37" stroke="#4a2f33" stroke-width="5.4" stroke-linecap="round"/><path d="M19 1.6 V10.4 M19 27.6 V36.4 M1.6 19 H10.4 M27.6 19 H36.4" stroke="#fbf3e1" stroke-width="2.6" stroke-linecap="round"/><circle cx="19" cy="19" r="2.4" fill="#f0705e" stroke="#4a2f33" stroke-width="1.2"/></svg><svg class="talk" width="36" height="34" viewBox="0 0 36 34"><path d="M9 3 H27 Q33 3 33 9 V17 Q33 23 27 23 H15 L5 31 L8 23 Q3 22 3 17 V9 Q3 3 9 3 Z" fill="#fbf3e1" stroke="#4a2f33" stroke-width="1.7" stroke-linejoin="round"/><circle cx="11.5" cy="13" r="2" fill="#4a2f33"/><circle cx="18" cy="13" r="2" fill="#4a2f33"/><circle cx="24.5" cy="13" r="2" fill="#4a2f33"/></svg></div>
<div id="hud"><div id="stars"><svg viewBox="0 0 44 44"><path d="M22 3 L27.6 15.6 L41 17 L31 26.2 L33.8 39.6 L22 32.8 L10.2 39.6 L13 26.2 L3 17 L16.4 15.6 Z" fill="#f2b84b" stroke="#2a2146" stroke-width="2.4" stroke-linejoin="round"/><path d="M22 9 L25.4 17.4 L22 20 Z" fill="#ffe2a0"/></svg><svg viewBox="0 0 44 44"><path d="M22 3 L27.6 15.6 L41 17 L31 26.2 L33.8 39.6 L22 32.8 L10.2 39.6 L13 26.2 L3 17 L16.4 15.6 Z" fill="#f2b84b" stroke="#2a2146" stroke-width="2.4" stroke-linejoin="round"/><path d="M22 9 L25.4 17.4 L22 20 Z" fill="#ffe2a0"/></svg><svg viewBox="0 0 44 44"><path d="M22 3 L27.6 15.6 L41 17 L31 26.2 L33.8 39.6 L22 32.8 L10.2 39.6 L13 26.2 L3 17 L16.4 15.6 Z" fill="#f2b84b" stroke="#2a2146" stroke-width="2.4" stroke-linejoin="round"/><path d="M22 9 L25.4 17.4 L22 20 Z" fill="#ffe2a0"/></svg></div><div id="cash" class="paper"><canvas width="260" height="84"></canvas></div><div id="map" class="paper"><canvas width="420" height="420"></canvas></div><div id="radio" class="paper"><canvas width="112" height="112"></canvas></div><div id="keyhint" class="paper"><canvas width="320" height="140"></canvas></div></div>
